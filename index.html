<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, minimum-scale=1.0, user-scalable=no">
<title>TT Team Jiu-Jitsu — Painel do Campeonato</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#0a0b08;
    --panel:#15170f;
    --panel-2:#1d2015;
    --line:#2a2e1f;
    --green:#8be33d;
    --green-deep:#588f22;
    --green-dim:#3c4a26;
    --red:#ff5d5a;
    --red-dim:#4a2622;
    --gold:#e8c468;
    --text:#f2f4ea;
    --text-dim:#98a086;
    --text-faint:#5b6350;
  }
  *{box-sizing:border-box;}
  body{
    margin:0;
    background:
      radial-gradient(ellipse at top left, rgba(139,227,61,0.08), transparent 45%),
      var(--bg);
    color:var(--text);
    font-family:'Inter',system-ui,sans-serif;
    min-height:100vh;
    padding-bottom:60px;
  }
  .display{font-family:'Bebas Neue',sans-serif; letter-spacing:0.03em;}

  header.top{
    padding:22px 18px 16px;
    border-bottom:2px solid var(--line);
    background:var(--bg);
  }
  .brand-row{display:flex; align-items:center; justify-content:space-between; gap:10px; flex-wrap:wrap;}
  .brand-eyebrow{
    font-size:11px; letter-spacing:0.25em; color:var(--green);
    text-transform:uppercase; font-weight:700;
  }
  h1.display{
    font-size:34px; margin:2px 0 0; line-height:0.95;
    color:var(--text);
  }
  h1.display span{color:var(--green);}
  .clock{
    text-align:right;
    font-variant-numeric:tabular-nums;
  }
  .clock .time{font-size:22px; font-weight:800; font-family:'Bebas Neue',sans-serif; letter-spacing:0.05em;}
  .clock .label{font-size:10px; color:var(--text-dim); text-transform:uppercase; letter-spacing:0.15em;}

  .event-banner{
    margin-top:14px;
    font-size:12px;
    font-weight:700;
    text-align:center;
    padding:7px 10px;
    border-radius:8px;
    background:var(--panel-2);
    border:1px solid var(--line);
    color:var(--text-dim);
  }
  .event-banner.today{
    background:rgba(139,227,61,0.1);
    border-color:var(--green);
    color:var(--green);
  }

  .next-up-banner{
    margin-top:8px;
    font-size:12px;
    font-weight:700;
    text-align:center;
    padding:8px 10px;
    border-radius:8px;
    background:rgba(232,196,104,0.1);
    border:1px solid var(--gold);
    color:var(--gold);
  }

  .btn-shared-toggle{
    width:100%;
    margin-top:8px;
    background:var(--panel-2);
    border:1px solid var(--line);
    color:var(--text-dim);
    padding:8px 10px;
    border-radius:8px;
    font-size:11.5px;
    font-weight:600;
    cursor:pointer;
  }
  .btn-shared-toggle.on{
    border-color:var(--green);
    color:var(--green);
    background:rgba(139,227,61,0.08);
  }
  .btn-shared-toggle b{font-weight:800;}

  .summary-row{
    display:flex; gap:8px; margin-top:16px; flex-wrap:wrap;
  }
  .stat-chip{
    flex:1 1 auto;
    min-width:78px;
    background:var(--panel);
    border:1px solid var(--line);
    border-radius:8px;
    padding:8px 10px;
    text-align:center;
  }
  .stat-chip b{display:block; font-size:20px; font-family:'Bebas Neue',sans-serif;}
  .stat-chip span{font-size:9.5px; color:var(--text-dim); text-transform:uppercase; letter-spacing:0.08em;}
  .stat-chip.tot b{color:var(--text);}
  .stat-chip.wait b{color:var(--text-dim);}
  .stat-chip.live b{color:var(--gold);}
  .stat-chip.out b{color:var(--red);}
  .stat-chip.done b{color:var(--green);}

  .medals-row{
    display:flex; gap:8px; margin-top:8px; flex-wrap:wrap;
  }
  .medal-chip{
    flex:1 1 auto;
    min-width:64px;
    text-align:center;
    padding:7px 8px;
    border-radius:8px;
    border:1px solid var(--line);
    background:var(--panel-2);
    font-family:'Bebas Neue',sans-serif;
    font-size:15px;
    letter-spacing:0.03em;
  }
  .medal-chip.gold{border-color:#e8c468; background:rgba(232,196,104,0.08); color:#e8c468;}
  .medal-chip.silver{border-color:#c7cdd6; background:rgba(199,205,214,0.08); color:#dfe3e8;}
  .medal-chip.bronze{border-color:#cd7f4a; background:rgba(205,127,74,0.08); color:#e0a276;}
  .medal-chip.fourth{border-color:var(--line); color:var(--text-dim);}

  .btn-add-absoluto{
    flex:0 0 auto;
    background:var(--gold);
    color:#0a0b08;
    border:none;
    padding:9px 14px;
    border-radius:8px;
    font-weight:800;
    font-size:13px;
    cursor:pointer;
    white-space:nowrap;
  }
  .add-form{
    max-width:640px;
    margin:12px auto 0;
    background:var(--panel-2);
    border:1px solid var(--gold);
    border-radius:10px;
    padding:12px;
  }
  .add-form-title{
    font-size:12px; font-weight:800; text-transform:uppercase;
    letter-spacing:0.05em; color:var(--gold); margin-bottom:8px;
  }
  .add-form-row{margin-bottom:8px;}
  .add-form-row.two{display:flex; gap:8px;}
  .add-form input, .add-form select{
    width:100%;
    background:var(--panel);
    border:1px solid var(--line);
    color:var(--text);
    padding:9px 10px;
    border-radius:7px;
    font-size:14px;
    font-family:'Inter',sans-serif;
  }
  .btn-confirm-add{
    flex:0 0 auto;
    background:var(--green);
    color:#0a0b08;
    border:none;
    padding:9px 16px;
    border-radius:7px;
    font-weight:800;
    font-size:13px;
    cursor:pointer;
    white-space:nowrap;
  }
  .absoluto-tag{
    color:#0a0b08; background:var(--gold);
  }
  .btn-remove-custom{
    background:transparent; color:var(--red); border:1px solid var(--red-dim);
    padding:8px 10px; border-radius:8px; font-size:11px; cursor:pointer;
  }

  .view-tabs{
    display:flex; gap:8px; margin-top:14px;
  }
  .view-tab-btn{
    flex:1;
    background:var(--panel);
    border:1px solid var(--line);
    color:var(--text-dim);
    padding:10px 12px;
    border-radius:8px;
    font-size:13px;
    font-weight:800;
    text-transform:uppercase;
    letter-spacing:0.03em;
    cursor:pointer;
  }
  .view-tab-btn.active{
    background:var(--green);
    color:#0a0b08;
    border-color:var(--green);
  }
  .view-tab-btn[data-view="absoluto"].active{
    background:var(--gold);
    border-color:var(--gold);
  }
  #absolutoCount{
    font-size:11px; font-weight:700; opacity:0.85;
  }

  .name-suggestions{
    position:absolute;
    top:100%; left:0; right:0;
    margin-top:4px;
    background:var(--panel);
    border:1px solid var(--gold);
    border-radius:8px;
    max-height:220px;
    overflow-y:auto;
    z-index:30;
  }
  .suggestion-item{
    padding:9px 12px;
    font-size:13px;
    cursor:pointer;
    border-bottom:1px solid var(--line);
    display:flex; justify-content:space-between; align-items:center; gap:8px;
  }
  .suggestion-item:last-child{border-bottom:none;}
  .suggestion-item:hover, .suggestion-item:active{background:var(--panel-2);}
  .suggestion-medal{
    font-size:10.5px; color:var(--text-dim); white-space:nowrap; flex:0 0 auto;
  }
  .result-absoluto-tag{
    display:inline-block;
    margin-left:6px;
    font-size:10.5px;
    font-weight:700;
    color:var(--gold);
  }

  .controls{
    display:flex; gap:8px; margin-top:14px; flex-wrap:wrap; align-items:center;
  }
  input.search{
    flex:1 1 160px;
    background:var(--panel-2);
    border:1px solid var(--line);
    color:var(--text);
    padding:9px 12px;
    border-radius:8px;
    font-size:14px;
    font-family:'Inter',sans-serif;
  }
  input.search::placeholder{color:var(--text-faint);}
  select.filter{
    background:var(--panel-2);
    border:1px solid var(--line);
    color:var(--text);
    padding:9px 10px;
    border-radius:8px;
    font-size:13px;
    font-family:'Inter',sans-serif;
  }

  main{padding:16px 14px 0; max-width:640px; margin:0 auto;}

  .section-header{
    display:flex; align-items:baseline; gap:10px;
    margin:22px 0 10px;
    padding-bottom:6px;
    border-bottom:2px solid var(--green-dim);
  }
  .section-header:first-child{margin-top:4px;}
  .section-header h2{
    font-family:'Bebas Neue',sans-serif;
    font-size:22px;
    letter-spacing:0.04em;
    margin:0;
    color:var(--green);
  }
  .section-header .count{
    font-size:11px; color:var(--text-faint); font-weight:600;
  }
  .section-header.absoluto-section{
    border-bottom-color:var(--gold);
  }
  .section-header.absoluto-section h2{
    color:var(--gold);
  }

  .note-banner{
    border:1px dashed var(--green-dim);
    background:rgba(139,227,61,0.05);
    color:var(--text-dim);
    border-radius:8px;
    padding:9px 12px;
    font-size:12.5px;
    margin-bottom:12px;
  }
  .note-banner b{color:var(--green);}

  .result-row{
    display:flex;
    justify-content:space-between;
    align-items:center;
    gap:10px;
    padding:11px 13px;
    background:var(--panel);
    border:1px solid var(--line);
    border-radius:10px;
    margin-bottom:8px;
  }
  .result-name{
    font-weight:700;
    font-size:14px;
    line-height:1.3;
  }
  .result-cat{
    display:block;
    font-size:11px;
    font-weight:500;
    color:var(--text-dim);
    margin-top:2px;
  }
  .result-tag{
    flex:0 0 auto;
    font-size:10.5px;
    font-weight:800;
    text-transform:uppercase;
    letter-spacing:0.03em;
    padding:5px 10px;
    border-radius:6px;
    white-space:nowrap;
  }
  .result-tag.gold{background:var(--gold); color:#0a0b08;}
  .result-tag.silver{background:#c7cdd6; color:#0a0b08;}
  .result-tag.bronze{background:#cd7f4a; color:#0a0b08;}
  .result-tag.fourth{background:var(--panel-2); color:var(--text-dim); border:1px solid var(--line);}
  .result-tag.out{background:var(--red-dim); color:var(--red); border:1px solid var(--red-dim);}
  .result-tag.live{background:var(--gold); color:#0a0b08;}
  .result-tag.wait{background:var(--panel-2); color:var(--text-dim); border:1px solid var(--line);}

  .card{
    background:var(--panel);
    border:1px solid var(--line);
    border-radius:12px;
    padding:14px 14px 12px;
    margin-bottom:12px;
    position:relative;
    transition:opacity .2s;
  }
  .card.is-out{
    border-color:var(--red-dim);
    background:linear-gradient(180deg, rgba(255,93,90,0.05), var(--panel));
  }
  .card.is-done{
    border-color:var(--green-deep);
  }
  .card-top{
    display:flex; justify-content:space-between; align-items:flex-start; gap:8px;
  }
  .name-block .name{
    font-size:18px; font-weight:800; line-height:1.15;
  }
  .meta-row{
    display:flex; gap:6px; margin-top:4px; flex-wrap:wrap;
  }
  .meta-tag{
    font-size:10.5px;
    color:var(--text-dim);
    background:var(--panel-2);
    border:1px solid var(--line);
    padding:2px 7px;
    border-radius:20px;
    font-weight:600;
    letter-spacing:0.02em;
  }
  .meta-tag.now{
    color:#0a0b08; background:var(--gold); border-color:var(--gold);
    font-weight:800;
  }
  .status-badge{
    font-size:10.5px;
    font-weight:800;
    text-transform:uppercase;
    letter-spacing:0.05em;
    padding:4px 9px;
    border-radius:6px;
    white-space:nowrap;
  }
  .status-badge.wait{color:var(--text-dim); background:var(--panel-2); border:1px solid var(--line);}
  .status-badge.live{color:#0a0b08; background:var(--gold);}
  .status-badge.out{color:var(--red); background:var(--red-dim); border:1px solid var(--red-dim);}
  .status-badge.done{color:#0a0b08; background:var(--green);}
  .status-badge.champ{color:#0a0b08; background:linear-gradient(90deg,var(--gold),var(--green));}

  .stripes{
    display:flex; gap:6px; margin-top:12px;
  }
  .stripe-col{flex:1; display:flex; flex-direction:column; align-items:center; gap:3px;}
  .stripe{
    width:100%;
    height:9px;
    border-radius:3px;
    background:var(--panel-2);
    border:1px solid var(--line);
    position:relative;
  }
  .stripe.w{background:var(--green); border-color:var(--green);}
  .stripe.l{background:var(--red); border-color:var(--red);}
  .stripe.skip{
    background:repeating-linear-gradient(45deg, var(--panel-2), var(--panel-2) 3px, #10120b 3px, #10120b 6px);
    border-style:dashed;
  }
  .stripe.active{border-color:var(--gold); box-shadow:0 0 0 2px rgba(232,196,104,0.2);}
  .stripe-label{
    font-size:8.5px; color:var(--text-faint); font-weight:700; text-transform:uppercase; letter-spacing:0.02em;
    white-space:nowrap;
  }

  .stripe.editable{
    cursor:pointer;
    box-shadow:0 0 0 2px rgba(232,196,104,0.5);
  }
  .stripe.editable:active{
    transform:scale(0.94);
  }
  .card.is-editing{
    border-color:var(--gold);
  }
  .edit-panel{
    margin-top:10px;
    padding-top:10px;
    border-top:1px dashed var(--gold);
  }
  .btn-edit-toggle{
    flex:0 0 auto;
    background:transparent;
    color:var(--gold);
    border:1px solid var(--gold);
    padding:8px 10px;
    border-radius:8px;
    font-size:11px;
    font-weight:700;
    cursor:pointer;
  }

  .fight-caption{
    margin-top:10px; font-size:11.5px; color:var(--text-dim);
  }
  .fight-caption b{color:var(--gold);}

  .action-row{
    display:flex; gap:8px; margin-top:6px;
  }
  .btn{
    flex:1;
    padding:10px 8px;
    border-radius:8px;
    font-weight:800;
    font-size:13px;
    text-transform:uppercase;
    letter-spacing:0.04em;
    border:none;
    cursor:pointer;
  }
  .btn-win{background:var(--green); color:#0a0b08;}
  .btn-lose{background:transparent; color:var(--red); border:1.5px solid var(--red-dim);}
  .btn-undo{
    flex:0 0 auto;
    background:transparent;
    color:var(--text-faint);
    border:1px solid var(--line);
    padding:8px 10px;
    border-radius:8px;
    font-size:11px;
    cursor:pointer;
    margin-top:12px;
  }
  .bottom-row{display:flex; flex-wrap:wrap; justify-content:flex-start; align-items:center; gap:8px;}
  .btn-checkin{
    background:transparent; color:var(--text-dim); border:1px solid var(--line);
    padding:8px 10px; border-radius:8px; font-size:11px; font-weight:700; cursor:pointer;
  }
  .btn-checkin.checked{ color:var(--green); border-color:var(--green-deep); background:rgba(139,227,61,0.08); }

  .final-line{
    margin-top:10px;
    font-size:12px;
    color:var(--text-dim);
  }
  .final-line b{color:var(--text);}

  .empty-state{
    text-align:center;
    color:var(--text-faint);
    padding:40px 20px;
    font-size:14px;
  }

  footer{
    text-align:center;
    color:var(--text-faint);
    font-size:11px;
    padding:24px 16px 10px;
  }
  footer .oss{color:var(--green); font-weight:700;}
  .footer-actions{
    display:flex; gap:8px; justify-content:center; flex-wrap:wrap; margin-bottom:12px;
  }
  .btn-footer-action{
    background:var(--panel-2);
    border:1px solid var(--line);
    color:var(--text-dim);
    padding:8px 12px;
    border-radius:8px;
    font-size:11.5px;
    font-weight:700;
    cursor:pointer;
  }
  .history-panel{
    max-width:640px;
    margin:0 auto 16px;
    background:var(--panel);
    border:1px solid var(--line);
    border-radius:10px;
    padding:10px 12px;
    max-height:260px;
    overflow-y:auto;
    text-align:left;
  }
  .history-empty{color:var(--text-faint); font-size:12px; text-align:center; padding:10px;}
  .history-item{
    font-size:11.5px;
    color:var(--text-dim);
    padding:6px 0;
    border-bottom:1px solid var(--line);
  }
  .history-item:last-child{border-bottom:none;}
  .history-item b{color:var(--text); font-weight:700;}

  .cat-breakdown{
    display:flex; gap:8px; flex-wrap:wrap; margin-bottom:16px;
  }
  .cat-chip{
    flex:1 1 auto; min-width:130px;
    background:var(--panel);
    border:1px solid var(--line);
    border-radius:10px;
    padding:9px 12px;
    text-align:center;
  }
  .cat-chip b{display:block; font-size:12.5px; color:var(--text); margin-bottom:3px;}
  .cat-chip span{font-size:12px;}
</style>
</head>
<body>

<header class="top">
  <div class="brand-row">
    <div>
      <div class="brand-eyebrow">TT Team Jiu-Jitsu</div>
      <h1 class="display">PAINEL DO <span>CAMPEONATO</span></h1>
    </div>
    <div class="clock">
      <div class="time" id="clockTime">--:--</div>
      <div class="label">agora</div>
    </div>
  </div>

  <div class="event-banner" id="eventBanner"></div>

  <div class="next-up-banner" id="nextUpBanner" style="display:none;"></div>

  <button class="btn-shared-toggle" id="sharedModeToggle">🔗 Sincronizar entre celulares <b>(desligado)</b></button>

  <div class="summary-row" id="summaryRow"></div>

  <div class="medals-row" id="medalsRow"></div>

  <div class="view-tabs" id="viewTabs">
    <button class="view-tab-btn active" data-view="lutas">Cronograma</button>
    <button class="view-tab-btn" data-view="absoluto">Absoluto <span id="absolutoCount"></span></button>
    <button class="view-tab-btn" data-view="resultados">Resultados</button>
  </div>

  <div class="controls" id="lutasControls">
    <input type="text" class="search" id="searchInput" placeholder="Buscar atleta...">
    <select class="filter" id="filterSelect">
      <option value="all">Todos</option>
      <option value="wait">Aguardando</option>
      <option value="live">Em andamento</option>
      <option value="out">Eliminados</option>
      <option value="done">Finalizados</option>
    </select>
  </div>

  <div class="controls" id="absolutoControls" style="display:none;">
    <button class="btn-add-absoluto" id="openAddForm">+ Adicionar atleta do Absoluto</button>
  </div>

  <div class="add-form" id="addForm" style="display:none;">
    <div class="add-form-title">Adicionar atleta do Absoluto</div>
    <div class="add-form-row" style="position:relative;">
      <input type="text" id="newName" placeholder="Nome do atleta (sugere quem já foi medalhado)" autocomplete="off">
      <input type="hidden" id="newLinkedId" value="">
      <div class="name-suggestions" id="nameSuggestions" style="display:none;"></div>
    </div>
    <div class="add-form-row two">
      <input type="text" id="newArea" placeholder="Área / mat">
      <input type="time" id="newTime" placeholder="Horário">
    </div>
    <div class="add-form-row two">
      <select id="newTotal">
        <option value="1">1 luta</option>
        <option value="2">2 lutas</option>
        <option value="3" selected>3 lutas</option>
        <option value="4">4 lutas</option>
        <option value="5">5 lutas</option>
        <option value="6">6 lutas</option>
      </select>
      <button class="btn-confirm-add" id="confirmAdd">Adicionar</button>
    </div>
  </div>
</header>

<main id="cardsContainer"></main>

<footer>
  <button class="btn-undo" id="resetAllBtn" style="margin:0 0 10px;">Zerar tudo (reiniciar painel)</button>
  <div class="footer-actions">
    <button class="btn-footer-action" id="exportBtn">⬇️ Baixar backup</button>
    <button class="btn-footer-action" id="importBtn">⬆️ Importar backup</button>
    <button class="btn-footer-action" id="toggleHistoryBtn">📜 Histórico</button>
  </div>
  <input type="file" id="importInput" accept="application/json" style="display:none;">
  <div class="history-panel" id="historyPanel" style="display:none;"></div>
  <div>Boa sorte, equipe! <span class="oss">OSS!</span></div>
</footer>

<script>
(function(){
  // ---------- DATA ----------
  // total = quantidade de lutas do atleta na categoria (bracket).
  const BASE_ATHLETES = [
    // Adultos
    {id:'a01', cat:'adultos', name:'Kaleb', time:'09:00', area:'Área 12', total:2},

  function delay(ms){ return new Promise(res=>setTimeout(res, ms)); }
  async function saveWithRetry(fn, label, retries){
    retries = retries === undefined ? 2 : retries;
    for(let attempt=0; attempt<=retries; attempt++){
      try{
        await fn();
        return true;
      }catch(e){
        if(attempt < retries){
          await delay(700 * (attempt+1));
        } else {
          console.error('Falha ao salvar (' + label + ') após ' + (retries+1) + ' tentativas', e);
          return false;
        }
      }
    }
  }

    return [];
  }

  async function setSharedMode(newVal){
    if(newVal === sharedMode) return;
    const previousState = state, previousCustom = CUSTOM_ATHLETES, previousCheckin = checkinState, previousHistory = historyLog;
    sharedMode = newVal;
    await saveSharedPref();
    if(sharedMode){
      const remoteState = await loadState();
      const remoteCustom = await loadCustomAthletes();
      const remoteCheckin = await loadCheckin();
      const remoteHistory = await loadHistory();
      const remoteHasData = Object.keys(remoteState).length > 0 || remoteCustom.length > 0;
      if(remoteHasData){
        state = remoteState;
        CUSTOM_ATHLETES = remoteCustom;
        checkinState = remoteCheckin;
        historyLog = remoteHistory;
      } else {
        state = previousState;
        CUSTOM_ATHLETES = previousCustom;
        checkinState = previousCheckin;
        historyLog = previousHistory;
        await saveState(); await saveCustomAthletes(); await saveCheckin(); await saveHistory();
      }
    } else {
      state = await loadState();
      CUSTOM_ATHLETES = await loadCustomAthletes();
      checkinState = await loadCheckin();
      historyLog = await loadHistory();
    }
    allAthletes().forEach(ensureAthleteState);
    updateSharedModeUI();
    render();

  function ensureAthleteState(a){
    if(!state[a.id] || !Array.isArray(state[a.id]) || state[a.id].length !== a.total){
      state[a.id] = new Array(a.total).fill(null);
    }
  }

  // ---------- BRACKET LOGIC ----------
  // Regra: a penúltima luta é a semifinal. Perder ANTES da semifinal elimina
  // (não segue nas demais). Perder a semifinal NÃO elimina: ainda tem mais
  // uma luta (disputa de 3º lugar). Ganhar a semifinal leva à final.
  // Quem tem só 1 luta: luta única e decisiva, sem fase.

  function eliminatedAtIndex(a){
    const f = state[a.id];
    if(a.total <= 2) return -1; // sem fase anterior à semifinal
    for(let i=0; i<=a.total-3; i++){
      if(f[i] === 'L') return i;
    }
    return -1;
  }
  function isEliminated(a){
    return eliminatedAtIndex(a) !== -1;
  }
  function activeIndex(a){
    const f = state[a.id];
    if(isEliminated(a)) return -1;
    for(let i=0;i<f.length;i++){ if(f[i]===null) return i; }
    return -1;
  }
  function fightLabel(a, i){
    const f = state[a.id];
    if(a.total === 1) return 'Luta única';
    if(i < a.total - 2) return 'Luta ' + (i+1);
    if(i === a.total - 2) return 'Semifinal';
    // última luta
    const semiRes = f[a.total-2];
    if(semiRes === 'W') return 'Final';
    if(semiRes === 'L') return 'Disputa de 3º lugar';
    return 'Final / 3º lugar';
  }
  function shortLabel(a, i){
    const f = state[a.id];
    if(a.total === 1) return 'ÚNICA';
    if(i < a.total - 2) return 'L' + (i+1);
    if(i === a.total - 2) return 'SF';
    const semiRes = f[a.total-2];
    if(semiRes === 'W') return 'FINAL';
    if(semiRes === 'L') return '3º';
    return 'F/3º';
  }
  // Medalha: quem vence a última luta fica em 1º; quem perde a última luta
  // (tendo vindo da semifinal vencida) fica em 2º; quem vence a disputa de
  // 3º lugar fica em 3º; quem perde a disputa de 3º lugar fica em 4º.
  function medalOf(a){
    if(a.fixedMedal) return a.fixedMedal;
    const f = state[a.id];
    if(a.total === 1){
      if(f[0]===null) return null;
      return f[0]==='W' ? 'gold' : 'silver';
    }
    const semiRes = f[a.total-2];
    const lastRes = f[a.total-1];
    if(lastRes === null) return null;
    if(semiRes === 'W') return lastRes === 'W' ? 'gold' : 'silver';
    return lastRes === 'W' ? 'bronze' : 'fourth';
  }
  function outcomeText(a){
    const m = medalOf(a);
    if(m === null) return null;
    if(m === 'gold') return '🥇 1º lugar';
    if(m === 'silver') return '🥈 2º lugar';
    if(m === 'bronze') return '🥉 3º lugar';
    return '4º lugar';
  }
  function statusOf(a){
    const f = state[a.id];
    if(isEliminated(a)) return 'out';
    if(f[0]===null) return 'wait';
    const idx = activeIndex(a);
    if(idx === -1){
      return medalOf(a) === 'gold' ? 'champ' : 'done';
    }
    return 'live';
  }
  function nowStr(){
    const d = new Date();
    return d.toTimeString().slice(0,5);
  }
  const EVENT_DATE = '2026-08-29'; // sábado do campeonato
  function todayStr(){
    const d = new Date();
    const y = d.getFullYear();
    const m = String(d.getMonth()+1).padStart(2,'0');
    const day = String(d.getDate()).padStart(2,'0');
    return `${y}-${m}-${day}`;
  }
  function isEventDay(){
    return todayStr() === EVENT_DATE;
  }
  function daysUntilEvent(){
    const today = new Date(todayStr() + 'T00:00:00');
    const event = new Date(EVENT_DATE + 'T00:00:00');
    return Math.round((event - today) / (1000*60*60*24));
  }
  function isNow(a){
    return statusOf(a)==='wait' && isEventDay() && a.time <= nowStr();
  }

  function setResult(a, idx, result){
    state[a.id][idx] = result;
    pushHistory(`${a.name}: ${fightLabel(a, idx)} marcada como ${result==='W'?'Venceu':'Perdeu'}`);
    saveState();
    render();
  }
  function undoLast(a){
    const f = state[a.id];
    for(let i=f.length-1;i>=0;i--){
      if(f[i]!==null){
        f[i]=null;
        pushHistory(`${a.name}: desfeita a última luta marcada`);
        break;
      }
    }
    saveState();
    render();
  }

  function statusBadgeHTML(a){
    const s = statusOf(a);
    if(s==='wait') return isNow(a) ? '<span class="status-badge live">Agora</span>' : '<span class="status-badge wait">Aguardando</span>';
    if(s==='live') return '<span class="status-badge live">Em andamento</span>';
    if(s==='out') return '<span class="status-badge out">Eliminado</span>';
    if(s==='champ') return `<span class="status-badge champ">${outcomeText(a)}</span>`;
    return `<span class="status-badge done">${outcomeText(a)}</span>`;
  }

  function cardHTML(a){
    const f = state[a.id];
    const s = statusOf(a);
    const idx = activeIndex(a);
    const elimIdx = eliminatedAtIndex(a);
    const isEditing = editModeCards.has(a.id);
    const editIdx = editSelection[a.id];

    let stripesHTML = '';
    for(let i=0;i<a.total;i++){
      let cls = 'stripe';
      if(f[i]==='W') cls += ' w';
      else if(f[i]==='L') cls += ' l';
      else if(s==='out') cls += ' skip';
      else if(i===idx) cls += ' active';
      const canEditThis = isEditing && f[i] !== null;
      if(canEditThis) cls += ' editable';
      const editAttr = canEditThis ? `data-editstripe="${a.id}:${i}"` : '';
      stripesHTML += `<div class="stripe-col"><div class="${cls}" ${editAttr}></div><div class="stripe-label">${shortLabel(a,i)}</div></div>`;
    }

    let actionRow = '';
    if(idx !== -1 && !isEditing){
      actionRow = `
        <div class="fight-caption">Resultado da <b>${fightLabel(a, idx)}</b>:</div>
        <div class="action-row">
          <button class="btn btn-win" data-id="${a.id}" data-idx="${idx}" data-res="W">Venceu</button>
          <button class="btn btn-lose" data-id="${a.id}" data-idx="${idx}" data-res="L">Perdeu</button>
        </div>`;
    }

    let editPanel = '';
    if(isEditing){
      if(typeof editIdx === 'number'){
        editPanel = `
          <div class="edit-panel">
            <div class="fight-caption">Editando <b>${fightLabel(a, editIdx)}</b>:</div>
            <div class="action-row">
              <button class="btn btn-win" data-editset="${a.id}:${editIdx}:W">Venceu</button>
              <button class="btn btn-lose" data-editset="${a.id}:${editIdx}:L">Perdeu</button>
            </div>
            <button class="btn-undo" data-editclear="${a.id}:${editIdx}" style="margin-top:8px;">Limpar este resultado</button>
          </div>`;
      } else {
        editPanel = `<div class="edit-panel"><div class="fight-caption">Toque numa luta já marcada acima para corrigir o resultado.</div></div>`;
      }
    }

    let finalLine = '';
    if(a.fixedMedal){
      finalLine = `<div class="final-line">Sem luta na categoria — colocação garantida.</div>`;
    } else if(s==='out'){
      finalLine = `<div class="final-line">Perdeu a <b>${fightLabel(a, elimIdx)}</b> — eliminado(a), não segue nas demais lutas.</div>`;
    } else if(s==='done' || s==='champ'){
      const wins = f.filter(x=>x==='W').length;
      const losses = f.filter(x=>x==='L').length;
      finalLine = `<div class="final-line"><b>${wins}</b> vitória(s) · <b>${losses}</b> derrota(s) em ${a.total} luta(s).</div>`;
    }

    const showUndo = f.some(x=>x!==null);
    const canEdit = a.total > 0 && f.some(x=>x!==null);
    const luteText = a.total === 0 ? 'Sem luta' : (a.total + (a.total>1 ? ' lutas' : ' luta'));
    const nowTag = isNow(a) ? '<span class="meta-tag now">Agora</span>' : '';
    const absolutoTag = a.cat === 'absoluto' ? '<span class="meta-tag absoluto-tag">Absoluto</span>' : '';
    const removeBtn = a.cat === 'absoluto' ? `<button class="btn-remove-custom" data-remove="${a.id}">Remover</button>` : '';
    const editToggleBtn = canEdit ? `<button class="btn-edit-toggle" data-edittoggle="${a.id}">${isEditing ? 'Fechar edição' : 'Editar'}</button>` : '';
    const isCheckedIn = !!checkinState[a.id];
    const checkinBtn = a.total > 0 ? `<button class="btn-checkin ${isCheckedIn?'checked':''}" data-checkin="${a.id}">${isCheckedIn ? '✅ Chegou' : '⬜ Marcar chegada'}</button>` : '';

    return `
      <div class="card ${s==='out'?'is-out':''} ${(s==='done'||s==='champ')?'is-done':''} ${isEditing?'is-editing':''}" data-cardid="${a.id}">

          <div class="name-block">
            <div class="name">${a.name}</div>
            <div class="meta-row">
              <span class="meta-tag">${a.time}</span>
              <span class="meta-tag">${a.area}</span>
              <span class="meta-tag">${luteText}</span>
              ${absolutoTag}
              ${nowTag}
            </div>
          </div>
          ${statusBadgeHTML(a)}
        </div>
        <div class="stripes">${stripesHTML}</div>
        ${actionRow}
        ${editPanel}
        ${finalLine}
        ${(showUndo || removeBtn || editToggleBtn || checkinBtn) ? `<div class="bottom-row">${checkinBtn}${showUndo && !isEditing ? `<button class="btn-undo" data-undo="${a.id}">Desfazer última</button>` : ''}${editToggleBtn}${removeBtn}</div>` : ''}
      </div>
    `;
  }

  function matchesFilters(a){
    if(searchTerm.trim()){
      const term = searchTerm.trim().toLowerCase();
      if(!a.name.toLowerCase().includes(term)) return false;
    }
    if(currentFilter !== 'all'){
      const s = statusOf(a);
      if(currentFilter==='done'){
        if(!(s==='done' || s==='champ')) return false;
      } else if(s !== currentFilter){
        return false;
      }
    }
    return true;
  }

  function outcomeBucket(a){
    const s = statusOf(a);
    if(s === 'champ') return 'gold';
    if(s === 'out') return 'out';
    if(s === 'live') return 'live';
    if(s === 'wait') return 'wait';
    return medalOf(a) || 'done'; // silver, bronze ou fourth
  }

  const BUCKET_ORDER = ['gold','silver','bronze','fourth','out','live','wait'];

    if(a.cat==='adultos') return 'Adultos';

    let absolutoTag = '';
    if(linkedAbsoluto){
      const lb = outcomeBucket(linkedAbsoluto);
      absolutoTag = `<span class="result-absoluto-tag">· Absoluto: ${BUCKET_TAG_LABELS[lb]}</span>`;
    }
    return `
      <div class="result-row">
        <div class="result-name">${a.name}<span class="result-cat">${subLine}${absolutoTag}</span></div>
        <div class="result-tag ${bucketKey}">${BUCKET_TAG_LABELS[bucketKey]}</div>
      </div>`;
  }

  const RANK_ORDER = {gold:0, silver:1, bronze:2, fourth:3, out:4, live:5, wait:6};

  function renderAbsolutoSection(){
    const items = CUSTOM_ATHLETES.filter(matchesFilters);
    if(items.length === 0) return '';
    const sorted = items.slice().sort((a,b)=>{
      const ra = RANK_ORDER[outcomeBucket(a)], rb = RANK_ORDER[outcomeBucket(b)];
      if(ra !== rb) return ra - rb;
      return a.time.localeCompare(b.time);
    });
    let html = `<div class="section-header absoluto-section"><h2>🥋 Absoluto</h2><span class="count">${sorted.length}</span></div>`;
    sorted.forEach(a=>{ html += resultRowHTML(a, outcomeBucket(a)); });
    return html;
  }

  function renderCategoryBreakdown(){
    const cats = ['adultos','kids','projeto'];
    let html = '<div class="cat-breakdown">';
    cats.forEach(c=>{
      const items = BASE_ATHLETES.filter(a=>a.cat===c);
      const g = items.filter(a=>medalOf(a)==='gold').length;
      const s = items.filter(a=>medalOf(a)==='silver').length;
      const b = items.filter(a=>medalOf(a)==='bronze').length;
      html += `<div class="cat-chip"><b>${catLabelOf({cat:c})}</b><span>🥇${g} · 🥈${s} · 🥉${b}</span></div>`;
    });
    html += '</div>';
    return html;
  }

  function renderResultsHTML(){
    const absolutoMap = {};
    CUSTOM_ATHLETES.forEach(c=>{ if(c.linkedId) absolutoMap[c.linkedId] = c; });

    const breakdownHtml = renderCategoryBreakdown();
    let bodyHtml = '';
    let any = false;

    const absHtml = renderAbsolutoSection();
    if(absHtml){ bodyHtml += absHtml; any = true; }

    const list = BASE_ATHLETES.filter(matchesFilters);
    BUCKET_ORDER.forEach(key=>{
      const items = list.filter(a=>outcomeBucket(a)===key).sort((x,y)=>x.time.localeCompare(y.time));
      if(items.length === 0) return;
      any = true;
      bodyHtml += `<div class="section-header"><h2>${BUCKET_LABELS[key]}</h2><span class="count">${items.length}</span></div>`;
      items.forEach(a=>{ bodyHtml += resultRowHTML(a, key, absolutoMap[a.id]); });
    });
    if(!any){
      bodyHtml = `<div class="empty-state">Nenhum resultado encontrado com esse filtro.</div>`;
    }
    return breakdownHtml + bodyHtml;
  }

  function render(){
    allAthletes().forEach(ensureAthleteState);
    renderSummary();

    document.getElementById('absolutoCount').textContent =
      CUSTOM_ATHLETES.length ? '(' + CUSTOM_ATHLETES.length + ')' : '';

    const container = document.getElementById('cardsContainer');
    let html = '';

    if(currentView === 'resultados'){
      html = renderResultsHTML();
      container.innerHTML = html;
      return;
    }

    const pool = currentView === 'absoluto'
      ? CUSTOM_ATHLETES
      : BASE_ATHLETES;
    const sorted = pool.slice().sort((a,b)=> a.time.localeCompare(b.time));
    const filtered = sorted.filter(matchesFilters);

    if(currentView === 'absoluto' && CUSTOM_ATHLETES.length === 0){
      html += `<div class="empty-state">Nenhum atleta do absoluto adicionado ainda. Use o botão acima assim que souber quem se inscreveu.</div>`;
    } else if(filtered.length === 0){
      html += `<div class="empty-state">Nenhum atleta encontrado com esse filtro.</div>`;
    } else {
      filtered.forEach(a=>{ html += cardHTML(a); });
    }

    container.innerHTML = html;

    container.querySelectorAll('[data-res]').forEach(btn=>{
      btn.addEventListener('click', ()=>{
        const a = allAthletes().find(x=>x.id===btn.dataset.id);
        setResult(a, parseInt(btn.dataset.idx,10), btn.dataset.res);
      });
    });
    container.querySelectorAll('[data-undo]').forEach(btn=>{
      btn.addEventListener('click', ()=>{
        const a = allAthletes().find(x=>x.id===btn.dataset.undo);
        undoLast(a);
      });
    });
  }

  document.getElementById('viewTabs').addEventListener('click', (e)=>{
    const btn = e.target.closest('.view-tab-btn');
    if(!btn) return;
    currentView = btn.dataset.view;
    document.querySelectorAll('.view-tab-btn').forEach(b=>b.classList.toggle('active', b===btn));
    document.getElementById('lutasControls').style.display = (currentView === 'lutas' || currentView === 'resultados') ? 'flex' : 'none';
    document.getElementById('absolutoControls').style.display = currentView === 'absoluto' ? 'flex' : 'none';
    if(currentView !== 'absoluto'){
      document.getElementById('addForm').style.display = 'none';
    }
    render();
  });

  // ---------- INIT ----------
  document.getElementById('searchInput').addEventListener('input', (e)=>{
    searchTerm = e.target.value; render();
  });
  document.getElementById('filterSelect').addEventListener('change', (e)=>{
    currentFilter = e.target.value; render();
  });
  document.getElementById('resetAllBtn').addEventListener('click', ()=>{
    if(confirm('Isso vai apagar todos os resultados marcados no painel. Tem certeza?')){
      state = {};
      allAthletes().forEach(ensureAthleteState);
      pushHistory('Painel zerado — todos os resultados foram apagados.');
      saveState();
      render();
    }
  });

  document.getElementById('openAddForm').addEventListener('click', ()=>{
    const form = document.getElementById('addForm');
    const isHidden = form.style.display === 'none';
    form.style.display = isHidden ? 'block' : 'none';
    if(isHidden){
      const now = new Date();
      document.getElementById('newTime').value = now.toTimeString().slice(0,5);
      document.getElementById('newName').focus();
    } else {
      document.getElementById('nameSuggestions').style.display = 'none';
    }
  });

  function medaledBaseAthletes(){
    return BASE_ATHLETES.filter(a=>{
      const m = medalOf(a);
      return m === 'gold' || m === 'silver' || m === 'bronze';
    });
  }
  function updateNameSuggestions(){
    const box = document.getElementById('nameSuggestions');
    const term = document.getElementById('newName').value.trim().toLowerCase();
    const medaled = medaledBaseAthletes();
    const matches = term ? medaled.filter(a=>a.name.toLowerCase().includes(term)) : medaled;
    if(matches.length === 0){
      box.style.display = 'none';
      box.innerHTML = '';
      return;
    }
    const medalIcon = {gold:'🥇 1º', silver:'🥈 2º', bronze:'🥉 3º'};
    box.innerHTML = matches.slice(0,8).map(a=>{
      const m = medalOf(a);
      return `<div class="suggestion-item" data-suggest="${a.id}"><span>${a.name}</span><span class="suggestion-medal">${medalIcon[m]} · ${catLabelOf(a)}</span></div>`;
    }).join('');
    box.style.display = 'block';
  }
  document.getElementById('newName').addEventListener('input', ()=>{
    document.getElementById('newLinkedId').value = '';
    updateNameSuggestions();
  });
  document.getElementById('newName').addEventListener('focus', updateNameSuggestions);
  document.getElementById('nameSuggestions').addEventListener('click', (e)=>{
    const item = e.target.closest('[data-suggest]');
    if(!item) return;
    const a = BASE_ATHLETES.find(x=>x.id===item.dataset.suggest);
    if(!a) return;
    document.getElementById('newName').value = a.name;
    document.getElementById('newLinkedId').value = a.id;
    document.getElementById('nameSuggestions').style.display = 'none';
  });
  document.addEventListener('click', (e)=>{
    if(!e.target.closest('#newName') && !e.target.closest('#nameSuggestions')){
      const box = document.getElementById('nameSuggestions');
      if(box) box.style.display = 'none';
    }
  });
  document.getElementById('confirmAdd').addEventListener('click', ()=>{
    const name = document.getElementById('newName').value.trim();
    const area = document.getElementById('newArea').value.trim();
    const time = document.getElementById('newTime').value || nowStr();
    const total = parseInt(document.getElementById('newTotal').value, 10);
    const linkedId = document.getElementById('newLinkedId').value || null;
    if(!name){
      alert('Digite o nome do atleta.');
      return;
    }
    const id = 'abs_' + Date.now() + '_' + Math.floor(Math.random()*1000);
    CUSTOM_ATHLETES.push({
      id, cat:'absoluto', name,
      area: area || 'Absoluto',
      time, total, linkedId
    });
    pushHistory(`${name}: adicionado(a) ao Absoluto`);
    saveCustomAthletes();
    ensureAthleteState({id, total});
    document.getElementById('newName').value = '';
    document.getElementById('newArea').value = '';
    document.getElementById('newLinkedId').value = '';
    document.getElementById('nameSuggestions').style.display = 'none';
    document.getElementById('addForm').style.display = 'none';
    render();
  });

  document.getElementById('cardsContainer').addEventListener('click', (e)=>{
    const removeBtn = e.target.closest('[data-remove]');
    if(removeBtn){
      if(confirm('Remover este atleta do absoluto do painel?')){
        const rid = removeBtn.dataset.remove;
        const removed = CUSTOM_ATHLETES.find(x=>x.id===rid);
        CUSTOM_ATHLETES = CUSTOM_ATHLETES.filter(x=>x.id!==rid);
        delete state[rid];
        editModeCards.delete(rid);
        delete editSelection[rid];
        if(removed) pushHistory(`${removed.name}: removido(a) do Absoluto`);
        saveCustomAthletes();
        saveState();
        render();
      }
      return;
    }

    const checkinBtn = e.target.closest('[data-checkin]');
    if(checkinBtn){
      const cid = checkinBtn.dataset.checkin;
      const a = allAthletes().find(x=>x.id===cid);
      checkinState[cid] = !checkinState[cid];
      if(a) pushHistory(`${a.name}: ${checkinState[cid] ? 'chegada marcada' : 'chegada desmarcada'}`);
      saveCheckin();
      render();
      return;
    }

    const toggleBtn = e.target.closest('[data-edittoggle]');
    if(toggleBtn){
      const id = toggleBtn.dataset.edittoggle;
      if(editModeCards.has(id)){
        editModeCards.delete(id);
        delete editSelection[id];
      } else {
        editModeCards.add(id);
      }
      render();
      return;
    }

    const stripeBtn = e.target.closest('[data-editstripe]');
    if(stripeBtn){
      const [id, idxStr] = stripeBtn.dataset.editstripe.split(':');
      editSelection[id] = parseInt(idxStr, 10);
      render();
      return;
    }

    const setBtn = e.target.closest('[data-editset]');
    if(setBtn){
      const [id, idxStr, res] = setBtn.dataset.editset.split(':');
      const idx = parseInt(idxStr,10);
      const a = allAthletes().find(x=>x.id===id);
      state[id][idx] = res;
      delete editSelection[id];
      if(a) pushHistory(`${a.name}: ${fightLabel(a, idx)} corrigida para ${res==='W'?'Venceu':'Perdeu'} (edição)`);
      saveState();
      render();
      return;
    }

    const clearBtn = e.target.closest('[data-editclear]');
    if(clearBtn){
      const [id, idxStr] = clearBtn.dataset.editclear.split(':');
      const idx = parseInt(idxStr,10);
      const a = allAthletes().find(x=>x.id===id);
      state[id][idx] = null;
      delete editSelection[id];
      if(a) pushHistory(`${a.name}: resultado da ${fightLabel(a, idx)} apagado (edição)`);
      saveState();
      render();
      return;
    }
  });

  function renderNextUpBanner(){
    const el = document.getElementById('nextUpBanner');
    if(!isEventDay()){ el.style.display = 'none'; return; }
    const candidates = allAthletes().filter(a=>
      a.total > 0 && statusOf(a) === 'wait' && a.time >= nowStr()
    );
    if(candidates.length === 0){ el.style.display = 'none'; return; }
    candidates.sort((a,b)=>a.time.localeCompare(b.time));
    const next = candidates[0];
    el.style.display = 'block';
    el.textContent = `⏭️ Próximo: ${next.name} — ${next.area} às ${next.time}`;
  }

  function tickClock(){
    document.getElementById('clockTime').textContent = nowStr();
    const el = document.getElementById('eventBanner');
    if(isEventDay()){
      el.textContent = '🥋 Hoje é dia de campeonato! Boa sorte, equipe!';
      el.className = 'event-banner today';
    } else {
      const d = daysUntilEvent();
      if(d > 0){
        el.textContent = `Faltam ${d} dia${d>1?'s':''} para o campeonato — sábado, 29/08.`;
      } else if(d === 0){
        el.textContent = '🥋 Hoje é dia de campeonato! Boa sorte, equipe!';
        el.className = 'event-banner today';
        renderNextUpBanner();
        return;
      } else {
        el.textContent = 'O campeonato já aconteceu.';
      }
      el.className = 'event-banner';
    }
    renderNextUpBanner();
  }
  setInterval(()=>{ tickClock(); render(); }, 30000);
  tickClock();

  document.getElementById('sharedModeToggle').addEventListener('click', async ()=>{
    if(!sharedMode){
      if(!confirm('Isso vai deixar os resultados visíveis para qualquer pessoa que abrir este mesmo painel (outros celulares/professores). Deseja ligar a sincronização?')){
        return;
      }
    } else {
      if(!confirm('Isso vai voltar este celular para os dados privados dele (deixa de sincronizar com os outros). Continuar?')){
        return;
      }
    }
    await setSharedMode(!sharedMode);
  });

  document.getElementById('exportBtn').addEventListener('click', ()=>{
    const payload = {
      exportedAt: new Date().toISOString(),
      state, customAthletes: CUSTOM_ATHLETES, checkinState, historyLog
    };
    const blob = new Blob([JSON.stringify(payload, null, 2)], {type:'application/json'});
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url;
    a.download = 'tt-team-backup-' + todayStr() + '-' + nowStr().replace(':','') + '.json';
    document.body.appendChild(a);
    a.click();
    document.body.removeChild(a);
    URL.revokeObjectURL(url);
  });

  document.getElementById('importBtn').addEventListener('click', ()=>{
    document.getElementById('importInput').click();
  });
  document.getElementById('importInput').addEventListener('change', (e)=>{
    const file = e.target.files[0];
    if(!file) return;
    const reader = new FileReader();
    reader.onload = async (ev)=>{
      try{
        const payload = JSON.parse(ev.target.result);
        if(!confirm('Isso vai substituir os dados atuais deste painel pelos dados do backup importado. Continuar?')){
          e.target.value = '';
          return;
        }
        state = payload.state || {};
        CUSTOM_ATHLETES = payload.customAthletes || [];
        checkinState = payload.checkinState || {};
        historyLog = payload.historyLog || [];
        allAthletes().forEach(ensureAthleteState);
        pushHistory('Backup importado.');
        await saveState();
        await saveCustomAthletes();
        await saveCheckin();
        render();
        alert('Backup importado com sucesso.');
      }catch(err){
        alert('Não consegui ler esse arquivo. Verifique se é um backup gerado por este painel.');
      }
      e.target.value = '';
    };
    reader.readAsText(file);
  });

  function renderHistoryPanel(){
    const panel = document.getElementById('historyPanel');
    if(historyLog.length === 0){
      panel.innerHTML = '<div class="history-empty">Nenhuma alteração registrada ainda.</div>';
      return;
    }
    panel.innerHTML = historyLog.slice().reverse().map(h=>
      `<div class="history-item"><b>${h.time}</b> — ${h.message}</div>`
    ).join('');
  }
  document.getElementById('toggleHistoryBtn').addEventListener('click', ()=>{
    const panel = document.getElementById('historyPanel');
    const isHidden = panel.style.display === 'none';
    if(isHidden){ renderHistoryPanel(); }
    panel.style.display = isHidden ? 'block' : 'none';
  });

  // Atualização periódica quando o modo sincronizado está ligado
  setInterval(async ()=>{
    if(!sharedMode) return;
    const remoteState = await loadState();
    const remoteCustom = await loadCustomAthletes();
    const remoteCheckin = await loadCheckin();
    const remoteHistory = await loadHistory();
    const changed = JSON.stringify(remoteState) !== JSON.stringify(state)
      || JSON.stringify(remoteCustom) !== JSON.stringify(CUSTOM_ATHLETES);
    if(changed){
      state = remoteState;
      CUSTOM_ATHLETES = remoteCustom;
      checkinState = remoteCheckin;
      historyLog = remoteHistory;
      allAthletes().forEach(ensureAthleteState);
      render();
      if(document.getElementById('historyPanel').style.display !== 'none'){
        renderHistoryPanel();
      }
    }
  }, 15000);

  (async function init(){
    sharedMode = await loadSharedPref();
    updateSharedModeUI();
    state = await loadState();
    CUSTOM_ATHLETES = await loadCustomAthletes();
    checkinState = await loadCheckin();
    historyLog = await loadHistory();
    render();
  })();
})();
</script>
</body>
</html>
